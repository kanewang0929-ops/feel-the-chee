name: 手动重跑自适应预测

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-adaptive-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Evaluate available result and regenerate forecast
        run: python scripts/learn_and_forecast.py

      - name: Commit model outputs when changed
        run: |
          git config user.name "feel-the-chee-learning-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/forecast.json data/forecast-history.json data/learning-log.json data/model-state.json

          if git diff --cached --quiet; then
            echo "Forecast unchanged"
            exit 0
          fi

          git commit -m "data: manually refresh adaptive forecast"
          git pull --rebase origin main
          git push origin main
