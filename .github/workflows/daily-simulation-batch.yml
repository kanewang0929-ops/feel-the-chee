name: Daily 100-simulation batch

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/run_simulation_batch.py"
      - "scripts/quantum_models.py"
      - "scripts/quantum_protocol.py"
      - "scripts/publish_simulation_dashboard.py"
      - "requirements.txt"
      - "data/draws.json"
      - ".github/workflows/daily-simulation-batch.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/**"
      - "index.html"
      - "simulation.html"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: daily-100-quantum-cycles-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  pull-request-tests:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test tests/*.js

  daily-batch:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Record batch start time
        id: timing
        shell: bash
        run: printf 'started_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Check out main branch
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install quantum model runtime
        run: python -m pip install -r requirements.txt
      - name: Run model and pipeline tests
        run: python -m unittest discover -s tests -v
      - name: Run 100 complete chronological quantum learning cycles
        id: simulations
        env:
          DUEL_BATCH_SEED: "${{ github.run_id }}-${{ github.run_attempt }}"
        run: |
          SIMULATION_SOURCE_COMMIT="$(git rev-parse HEAD)" python scripts/run_simulation_batch.py --count 100 --batch-seed "$DUEL_BATCH_SEED" --output-dir simulation-artifacts
      - name: Read previous dashboard history
        if: always() && steps.checkout.outcome == 'success'
        shell: bash
        run: |
          git fetch origin simulation-data
          git show origin/simulation-data:data/simulation-dashboard-history.json > /tmp/simulation-dashboard-history.json
      - name: Build dashboard feed
        id: publish_feed
        if: always() && steps.checkout.outcome == 'success'
        env:
          BATCH_OUTCOME: "${{ steps.simulations.outcome }}"
          RUN_ID: "${{ github.run_id }}"
          RUN_ATTEMPT: "${{ github.run_attempt }}"
          RUN_NUMBER: "${{ github.run_number }}"
          RUN_STARTED_AT: "${{ steps.timing.outputs.started_at }}"
          RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          python scripts/publish_simulation_dashboard.py \
            --summary simulation-artifacts/simulation-batch-summary.json \
            --existing-feed /tmp/simulation-dashboard-history.json \
            --output /tmp/simulation-dashboard-history-next.json \
            --archive data/draws.json --status "$BATCH_OUTCOME" \
            --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --run-number "$RUN_NUMBER" \
            --run-url "$RUN_URL" --started-at "$RUN_STARTED_AT"
      - name: Publish batch evidence and qualifying model package together
        if: always() && steps.publish_feed.outcome == 'success'
        env:
          BATCH_OUTCOME: "${{ steps.simulations.outcome }}"
        run: |
          git worktree add --detach /tmp/simulation-data origin/simulation-data
          mkdir -p /tmp/simulation-data/data
          cp /tmp/simulation-dashboard-history-next.json /tmp/simulation-data/data/simulation-dashboard-history.json
          if test "$BATCH_OUTCOME" = success; then
            test -f simulation-artifacts/joy-kane-batch-models.json
            cp simulation-artifacts/joy-kane-batch-models.json /tmp/simulation-data/data/joy-kane-batch-models.json
          fi
          cd /tmp/simulation-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/simulation-dashboard-history.json
          if test "$BATCH_OUTCOME" = success; then git add data/joy-kane-batch-models.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish completed quantum cycles and batch evidence $GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
          git pull --rebase origin simulation-data
          git push origin HEAD:refs/heads/simulation-data
      - name: Upload all checkpoints and selected chronological traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-simulation-batch-${{ github.run_number }}
          path: simulation-artifacts/
          if-no-files-found: warn
          retention-days: 30
