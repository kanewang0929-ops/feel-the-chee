name: Daily Joy and Kane prediction duel

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/sync_draws.py"
      - "scripts/chee_formula.py"
      - "scripts/chee_backtest.py"
      - "scripts/joy_kane_duel.py"
      - "scripts/summarize_joy_kane_logs.py"
      - "assets/app.js"
      - "assets/joy-kane.js"
      - "assets/style.css"
      - "index.html"
      - ".github/workflows/sync-draws.yml"
  schedule:
    # Daily Beijing-time 09:15. Extra draw-night syncs refresh predictions after results publish.
    - cron: "15 1 * * *"
    - cron: "10,35 14 * * 1,3,6"
    - cron: "0 15 * * 1,3,6"

permissions:
  contents: write

concurrency:
  group: joy-kane-daily-prediction-duel
  cancel-in-progress: true

jobs:
  sync-train-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize the complete draw database
        run: python scripts/sync_draws.py

      - name: Audit the formula-only Feng Shui engine
        run: python scripts/chee_backtest.py

      - name: Generate formula-only Feng Shui forecast
        run: python scripts/chee_formula.py

      - name: Run strict walk-forward Joy and Kane duel
        env:
          DUEL_WARMUP_DRAWS: "200"
          DUEL_CYCLES: "1000000"
          MIN_HOURS_BETWEEN_DUEL_TRAINING: "23"
        run: python scripts/joy_kane_duel.py

      - name: Summarize daily optimization logs older than seven days
        run: python scripts/summarize_joy_kane_logs.py

      - name: Commit draw database, forecasts, agent states, and audit ledgers
        run: |
          git config user.name "feel-the-chee-learning-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/draws.json data/chee-forecast.json data/chee-backtest.json data/joy-kane-*

          if git diff --cached --quiet; then
            echo "No draw, forecast, agent state, audit, or training-log changes detected."
            exit 0
          fi

          git commit -m "data: refresh Joy and Kane predictions and learning audit"
          git pull --rebase origin main
          git push origin main
