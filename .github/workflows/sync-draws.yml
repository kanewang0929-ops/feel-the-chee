name: Daily Joy and Kane prediction duel

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily 100-simulation batch"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "scripts/sync_draws.py"
      - "scripts/joy_kane_live.py"
      - "scripts/evaluate_live_predictions.py"
      - "scripts/retire_legacy_simulation_run.py"
      - "scripts/quantum_protocol.py"
      - "scripts/quantum_models.py"
      - "assets/app.js"
      - "assets/joy-kane.js"
      - "index.html"
      - ".github/workflows/sync-draws.yml"
  schedule:
    - cron: "15 1 * * *"
    - cron: "10,35 14 * * 1,3,6"
    - cron: "0 15 * * 1,3,6"

permissions:
  contents: write
  actions: write

concurrency:
  group: joy-kane-live-ledger
  cancel-in-progress: false

jobs:
  sync-score-and-publish:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retire the pinned pre-quantum migration run
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/retire_legacy_simulation_run.py
      - name: Install quantum model runtime
        run: python -m pip install -r requirements.txt
      - name: Synchronize the complete draw database
        run: python scripts/sync_draws.py
      - name: Read latest completed batch model package
        run: |
          git fetch origin simulation-data
          if git cat-file -e origin/simulation-data:data/joy-kane-batch-models.json 2>/dev/null; then
            git show origin/simulation-data:data/joy-kane-batch-models.json > /tmp/joy-kane-batch-models.json
          fi
      - name: Score sealed results and apply the next-prediction gate
        run: python scripts/joy_kane_live.py --batch-models /tmp/joy-kane-batch-models.json
      - name: Build read-only live evaluation from the verified ledger
        run: python scripts/evaluate_live_predictions.py
      - name: Commit draw database, forecasts, agent states, and audit ledgers
        run: |
          git config user.name "feel-the-chee-learning-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/draws.json data/joy-kane-dashboard.json data/joy-kane-model-state.json data/joy-kane-audit.json data/joy-kane-live-evaluation.json
          for output in data/joy-kane-live-lock.json data/joy-kane-live-ledger.jsonl; do
            if test -f "$output"; then git add "$output"; fi
          done
          if git diff --cached --quiet; then
            echo "No live draw, score, gate or prediction changes."
            exit 0
          fi
          git commit -m "data: score sealed Joy and Kane predictions and refresh publication gate"
          git restore --worktree -- .
          git pull --rebase origin main
          git push origin main
      - name: Request 100 cycles when the current archive needs training
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python - <<'CHECK'
          import json
          from pathlib import Path
          from scripts.quantum_protocol import load_archive, validate_package
          try:
              package = json.loads(Path('/tmp/joy-kane-batch-models.json').read_text())
              validate_package(package, load_archive(Path('data/draws.json')))
          except (OSError, ValueError, KeyError, TypeError):
              raise SystemExit(1)
          CHECK
          then
            echo "A complete matching 100-cycle model package is already available."
            exit 0
          fi
          active=$(gh run list --workflow daily-simulation-batch.yml --branch main --limit 30 --json status --jq '[.[] | select(.status != "completed")] | length')
          if test "$active" -gt 0; then
            echo "A 100-cycle batch is already active; publication will be checked when it completes."
          else
            gh workflow run daily-simulation-batch.yml --ref main
          fi
