name: 同步开奖并学习预测

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/sync_draws.py"
      - "scripts/learn_and_forecast.py"
      - "scripts/generate_forecast.py"
      - ".github/workflows/sync-draws.yml"
  schedule:
    # 北京时间周一、周三、周六 22:10、22:35、23:00。
    - cron: "10,35 14 * * 1,3,6"
    - cron: "0 15 * * 1,3,6"

permissions:
  contents: write

concurrency:
  group: sync-learn-forecast
  cancel-in-progress: false

jobs:
  sync-learn-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize complete draw history
        run: python scripts/sync_draws.py

      - name: Evaluate previous forecast and generate next forecast
        run: python scripts/learn_and_forecast.py

      - name: Commit draw, learning, and forecast updates
        run: |
          git config user.name "feel-the-chee-learning-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/draws.json data/forecast.json data/forecast-history.json data/learning-log.json data/model-state.json

          if git diff --cached --quiet; then
            echo "No draw or model changes detected."
            exit 0
          fi

          git commit -m "data: sync draw, learn, and publish next forecast"
          git pull --rebase origin main
          git push origin main
