name: 同步开奖并更新预测

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/sync_draws.py"
      - "scripts/curve_forecast.py"
      - "scripts/ai_backtest.py"
      - "scripts/chee_formula.py"
      - "scripts/chee_backtest.py"
      - "assets/ai-backtest.js"
      - "assets/chee-backtest.js"
      - ".github/workflows/sync-draws.yml"
  schedule:
    # 北京时间周一、周三、周六 22:10、22:35、23:00。
    - cron: "10,35 14 * * 1,3,6"
    - cron: "0 15 * * 1,3,6"

permissions:
  contents: write

concurrency:
  group: sync-curve-formula-backtests
  cancel-in-progress: true

jobs:
  sync-and-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize complete draw history
        run: python scripts/sync_draws.py

      - name: Learn draw curves and sample the next AI forecast
        run: python scripts/curve_forecast.py

      - name: Calculate formula-only Feel the Chee results
        run: python scripts/chee_formula.py

      - name: Backtest AI with strict walk-forward training
        run: python scripts/ai_backtest.py

      - name: Backtest Feel the Chee across all stored draws
        run: python scripts/chee_backtest.py

      - name: Commit draw, forecast, formula, and backtest updates
        run: |
          git config user.name "feel-the-chee-learning-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            data/draws.json \
            data/forecast.json \
            data/forecast-history.json \
            data/learning-log.json \
            data/model-state.json \
            data/ai-backtest.json \
            data/chee-forecast.json \
            data/chee-backtest.json

          if git diff --cached --quiet; then
            echo "No draw, forecast, formula, or backtest changes detected."
            exit 0
          fi

          git commit -m "data: refresh draw, AI audit, and Chee audit"
          git pull --rebase origin main
          git push origin main
