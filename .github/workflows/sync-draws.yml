name: 同步开奖并更新预测

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/sync_draws.py"
      - "scripts/curve_forecast.py"
      - "scripts/ai_backtest.py"
      - "scripts/chee_formula.py"
      - "scripts/chee_backtest.py"
      - "scripts/hybrid_agent.py"
      - "scripts/hybrid_backtest.py"
      - "scripts/intuitive_agent.py"
      - "scripts/intuitive_agent_runtime.py"
      - "scripts/intuitive_backtest.py"
      - "scripts/intuitive_backtest_runner.py"
      - "scripts/intuitive_simulation_learning.py"
      - "scripts/daily_simulation_learning.py"
      - "assets/ai-backtest.js"
      - "assets/chee-backtest.js"
      - "assets/hybrid-agent.js"
      - "assets/agent-instinct.js"
      - "index.html"
      - ".github/workflows/sync-draws.yml"
  schedule:
    # 每天北京时间09:15运行三模型完整模拟与学习闭环。
    - cron: "15 1 * * *"
    # 保留开奖日晚间重试：北京时间周一、周三、周六22:10、22:35、23:00。
    - cron: "10,35 14 * * 1,3,6"
    - cron: "0 15 * * 1,3,6"

permissions:
  contents: write

concurrency:
  group: sync-curve-formula-instinct-backtests
  cancel-in-progress: true

jobs:
  sync-and-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize complete draw history
        run: python scripts/sync_draws.py

      - name: Backtest AI with strict walk-forward training
        run: python scripts/ai_backtest.py

      - name: Backtest Feel the Chee across all stored draws
        run: python scripts/chee_backtest.py

      - name: Simulate AI, Chee, and independent Agent Instinct
        run: python scripts/intuitive_backtest_runner.py

      - name: Apply simulation learning and archive permanent model logs
        run: python scripts/daily_simulation_learning.py

      - name: Apply three-source Agent Instinct learning
        run: python scripts/intuitive_simulation_learning.py

      - name: Learn draw curves and sample the next AI forecast
        run: python scripts/curve_forecast.py

      - name: Calculate formula-only Feel the Chee results
        run: python scripts/chee_formula.py

      - name: Generate the next two Agent Instinct results
        run: python scripts/intuitive_agent_runtime.py

      - name: Commit draw, forecasts, audits, states, and permanent logs
        run: |
          git config user.name "feel-the-chee-learning-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            data/draws.json \
            data/forecast.json \
            data/forecast-history.json \
            data/learning-log.json \
            data/model-state.json \
            data/ai-backtest.json \
            data/ai-simulation-log.json \
            data/ai-master-learning-log.json \
            data/ai-forecast-master-history.json \
            data/chee-forecast.json \
            data/chee-backtest.json \
            data/chee-model-state.json \
            data/chee-simulation-log.json \
            data/hybrid-forecast.json \
            data/hybrid-history.json \
            data/hybrid-learning-log.json \
            data/hybrid-model-state.json \
            data/hybrid-backtest.json \
            data/hybrid-simulation-log.json \
            data/hybrid-master-learning-log.json \
            data/hybrid-forecast-master-history.json \
            data/model-cycle-log.json

          if git diff --cached --quiet; then
            echo "No draw, forecast, audit, state, or learning-log changes detected."
            exit 0
          fi

          git commit -m "data: refresh daily AI, Chee, and Agent Instinct learning"
          git pull --rebase origin main
          git push origin main
