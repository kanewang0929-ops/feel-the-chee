name: Compact walk-forward Agent records

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/compact_walk_forward_agent.py"
      - ".github/workflows/compact-walk-forward.yml"

permissions:
  contents: write

concurrency:
  group: compact-walk-forward-agent-records
  cancel-in-progress: true

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compact the dashboard and preserve per-draw result ledger
        run: python scripts/compact_walk_forward_agent.py

      - name: Commit compact dashboard and result ledger
        run: |
          git config user.name "feel-the-chee-learning-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/walk-forward-agent.json data/walk-forward-agent-results.jsonl

          if git diff --cached --quiet; then
            echo "Walk-forward dashboard is already compact."
            exit 0
          fi

          git commit -m "data: compact walk-forward Agent dashboard"
          git pull --rebase origin main
          git push origin main
